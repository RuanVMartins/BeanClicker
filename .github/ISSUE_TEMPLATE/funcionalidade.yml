name: Funcionalidade
description: Proponha uma nova funcionalidade ou melhoria
title: 'feat: '
labels: ['funcionalidade']
body:
  - type: textarea
    id: problema
    attributes:
      label: O que isto acrescenta ao jogo?
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceitação
      placeholder: |
        - [ ] O jogador consegue...
        - [ ] O jogo impede...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options: [gameplay/economia, cassino, interface/UI, arte/áudio, save, documentação, repositório/pipeline]
    validations:
      required: true
